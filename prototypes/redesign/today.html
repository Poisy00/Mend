<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mend Redesign Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Prototype chrome (not part of any direction) ───────── */
:root { --ease-out:cubic-bezier(.23,1,.32,1); --ease-swap:cubic-bezier(.2,0,0,1); }
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; }
body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
button { font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; }
h1,h2,h3 { text-wrap:balance; margin:0; } p { text-wrap:pretty; margin:0; }
.proto-bar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 16px; background:#111; color:#eee; font:500 13px/1.4 system-ui,sans-serif; }
.proto-bar strong { font-weight:600; margin-inline-end:8px; }
.proto-bar .seg { display:flex; gap:2px; background:#2a2a2a; padding:2px; border-radius:8px; }
.proto-bar .seg button { border:0; background:transparent; color:#bbb; padding:5px 10px; border-radius:6px; cursor:pointer; transition:background-color 150ms, color 150ms; }
.proto-bar .seg button[aria-pressed="true"] { background:#fff; color:#111; }
.proto-bar .note { color:#999; margin-inline-start:auto; max-width:46ch; }
@media (max-width:760px){ .proto-bar .note { display:none; } }

/* Shared motifs */
.stitch { position:relative; }
.stitch::after { content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:repeating-linear-gradient(90deg,var(--done) 0 6px,transparent 6px 10px); clip-path:inset(0 100% 0 0); animation:stitch 900ms var(--ease-out) forwards; }
@keyframes stitch { 0%{clip-path:inset(0 100% 0 0)} 55%{clip-path:inset(0)} 100%{clip-path:inset(0);opacity:0} }
.collapse { display:grid; grid-template-rows:1fr; transition:grid-template-rows 220ms var(--ease-out), opacity 220ms var(--ease-out); }
.collapse > * { min-height:0; overflow:hidden; }
.collapse.gone { grid-template-rows:0fr; opacity:0; }
.ico { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
.press { transition:scale 150ms var(--ease-out), background-color 150ms, color 150ms, box-shadow 150ms; }
.press:not(:disabled):active { scale:.96; }
.num { font-variant-numeric:tabular-nums; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }

/* Menu + toast, themed by the active direction's tokens */
.menu { position:fixed; z-index:60; min-width:168px; padding:4px; border-radius:12px; background:var(--pop); color:var(--ink); box-shadow:0 0 0 1px var(--line), 0 16px 40px -16px rgb(0 0 0 / .35); transform-origin:var(--origin, top right); transition:opacity 160ms var(--ease-out), scale 160ms var(--ease-out); overscroll-behavior:contain; }
.menu[data-hidden] { opacity:0; scale:.97; pointer-events:none; }
.menu p { padding:6px 10px 4px; font-size:12px; color:var(--ink-2); }
.menu button { display:flex; width:100%; justify-content:space-between; gap:16px; border:0; background:none; text-align:start; padding:8px 10px; border-radius:8px; font-size:14px; cursor:pointer; }
.menu button:hover { background:var(--hover); }
.menu button span { color:var(--ink-2); }
.toast { position:fixed; z-index:70; left:50%; bottom:20px; translate:-50% 0; display:flex; align-items:center; gap:14px; padding:10px 10px 10px 16px; border-radius:12px; background:var(--toast); color:var(--toast-ink); font-size:14px; box-shadow:0 12px 32px -12px rgb(0 0 0 / .45); transition:opacity 200ms var(--ease-out), translate 200ms var(--ease-out); }
.toast[data-hidden] { opacity:0; translate:-50% 12px; pointer-events:none; }
.toast button { border:0; background:rgb(255 255 255 / .14); color:inherit; padding:5px 10px; border-radius:7px; cursor:pointer; font-weight:600; }
@media (prefers-reduced-motion:reduce){ .B .hero-in.enter { transition-property:opacity; translate:none; filter:none; } .menu,.toast{ scale:1 !important; translate:-50% 0 !important; } .menu{ translate:none !important; } .press:active{ scale:1; } .stitch::after{ animation-duration:600ms; } .collapse{ transition-property:opacity; } }

/* ═════════ A · SHIFT LINE ═════════ */
.A { --bg:#F1F2F4; --sheet:#FFFFFF; --ink:#16181D; --ink-2:#5A606C; --ink-3:#7A808C; --line:#E2E4E9; --hover:#F4F5F7; --pop:#FFFFFF;
  --iris:#4E3D8F; --iris-ink:#FFFFFF; --wash:#EEEBF8; --late:#B4381F; --late-tint:#FBEAE4; --due:#8A5A00; --due-tint:#F7EED8; --done:#17714F; --ring:#4E3D8F;
  --toast:#16181D; --toast-ink:#F1F2F4;
  font-family:"Schibsted Grotesk",system-ui,sans-serif; font-size:14px; line-height:1.45; color:var(--ink); background:var(--bg); min-height:calc(100dvh - 44px); }
[data-theme="dark"] .A { --bg:#0E1014; --sheet:#161920; --ink:#E8EAEE; --ink-2:#9BA1AD; --ink-3:#7D8390; --line:#262A33; --hover:#1E222A; --pop:#1E222A;
  --iris:#B4A6F3; --iris-ink:#191433; --wash:#241F3C; --late:#F29A85; --late-tint:#3A211B; --due:#E8C06E; --due-tint:#33291A; --done:#7FD3AE; --ring:#B4A6F3; --toast:#E8EAEE; --toast-ink:#16181D; }
.A .shell { display:grid; grid-template-columns:224px minmax(0,1fr); min-height:inherit; }
.A .side { padding:14px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:44px; height:calc(100dvh - 44px); }
.A .logo { font-weight:700; font-size:19px; letter-spacing:-.03em; padding:6px 10px 22px; display:flex; align-items:center; gap:8px; }
.A .logo i { width:18px; height:2px; background:repeating-linear-gradient(90deg,var(--iris) 0 4px,transparent 4px 7px); display:inline-block; }
.A .nav { display:flex; align-items:center; gap:10px; height:36px; padding:0 10px; border-radius:8px; color:var(--ink-2); font-weight:500; text-decoration:none; border:0; background:none; width:100%; cursor:pointer; text-align:start; }
.A .nav:hover { background:rgb(0 0 0 / .04); color:var(--ink); }
[data-theme="dark"] .A .nav:hover { background:rgb(255 255 255 / .05); }
.A .nav[aria-current] { background:var(--sheet); color:var(--ink); box-shadow:0 0 0 1px rgb(0 0 0 / .06), 0 1px 2px rgb(0 0 0 / .05); }
.A .nav[aria-current] .ico { color:var(--iris); }
.A .nav .count { margin-inline-start:auto; font-size:12px; font-weight:600; min-width:20px; height:20px; padding:0 6px; border-radius:10px; display:grid; place-items:center; background:var(--late-tint); color:var(--late); }
.A .agent { margin-top:auto; display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:10px; }
.A .avatar { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; background:var(--sheet); box-shadow:0 0 0 1px var(--line); color:var(--ink-2); }
.A .agent small { display:flex; align-items:center; gap:6px; color:var(--ink-2); font-size:12px; }
.A .agent small::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--done); }
.A .main { margin:8px 8px 8px 0; background:var(--sheet); border-radius:14px; box-shadow:0 0 0 1px rgb(0 0 0 / .05), 0 8px 24px -14px rgb(0 0 0 / .1); padding:36px 40px 64px; min-width:0; }
.A header.page { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; padding-bottom:28px; }
.A .date { color:var(--ink-2); font-size:14px; font-weight:500; margin-bottom:6px; }
.A h1 { font-size:32px; line-height:1.12; font-weight:600; letter-spacing:-.025em; }
.A h1 em { font-style:normal; color:var(--late); }
.A .sub { color:var(--ink-2); margin-top:8px; font-size:15px; }
.A .btn { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px 0 12px; border-radius:9px; border:0; cursor:pointer; font-weight:600; font-size:14px; }
.A .btn-primary { background:var(--iris); color:var(--iris-ink); box-shadow:inset 0 1px 0 rgb(255 255 255 / .14), 0 1px 2px rgb(0 0 0 / .2); }
.A .btn-ghost { background:var(--sheet); color:var(--ink); box-shadow:0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / .04); }
.A .btn-ghost:hover { background:var(--hover); }
.A .cols { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:40px; align-items:start; }
.A .tl-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.A .tl-head h2 { font-size:17px; font-weight:600; letter-spacing:-.015em; }
.A .tl-head span { color:var(--ink-2); font-size:13px; }
.A .row { display:grid; grid-template-columns:68px 22px minmax(0,1fr) auto; align-items:center; column-gap:12px; min-height:60px; padding:0 12px 0 0; border-radius:10px; cursor:pointer; position:relative; outline-offset:-2px; }
.A .row:hover { background:var(--hover); }
.A .row[aria-current="true"] { background:var(--wash); }
.A .t { text-align:end; font-size:13px; color:var(--ink-2); font-weight:500; }
.A .node { align-self:stretch; position:relative; display:grid; place-items:center; }
.A .node::before { content:""; position:absolute; top:0; bottom:0; left:50%; width:2px; translate:-1px 0; background:var(--line); }
.A .tl > :first-child .node::before { top:50%; }
.A .tl > :last-child .node::before { bottom:50%; }
.A .node b { position:relative; width:10px; height:10px; border-radius:50%; background:var(--sheet); box-shadow:0 0 0 2px var(--ink-3); }
.A .is-late .node b { background:var(--late); box-shadow:0 0 0 3px var(--late-tint); }
.A .is-now .node b { background:var(--due); box-shadow:0 0 0 3px var(--due-tint); }
.A .is-soon .node b { box-shadow:0 0 0 2px var(--iris); }
.A .name { display:flex; align-items:baseline; gap:8px; min-width:0; }
.A .name strong { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.A .id { font-size:12px; color:var(--ink-3); flex:none; }
.A .reason { color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13.5px; }
.A .due { font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap; }
.A .is-late .due { color:var(--late); font-weight:600; }
.A .is-now .due { color:var(--due); font-weight:600; }
.A .acts { display:none; gap:4px; }
@media (hover:hover){ .A .row:hover .acts, .A .row:focus-within .acts { display:flex; } .A .row:hover .due, .A .row:focus-within .due { display:none; } }
.A .icon-btn { width:32px; height:32px; border-radius:8px; border:0; display:grid; place-items:center; cursor:pointer; background:var(--sheet); box-shadow:0 0 0 1px var(--line); color:var(--ink-2); position:relative; }
.A .icon-btn::before { content:""; position:absolute; inset:-4px; }
.A .icon-btn:hover { color:var(--ink); }
.A .now-row { display:grid; grid-template-columns:68px 22px minmax(0,1fr); column-gap:12px; align-items:center; height:28px; }
.A .now-row .t { color:var(--iris); font-weight:700; }
.A .now-row .node b { width:12px; height:12px; background:var(--iris); box-shadow:0 0 0 4px var(--wash); }
.A .now-row .rule { height:2px; background:var(--iris); border-radius:2px; position:relative; }
.A .now-row .rule span { position:absolute; inset-inline-end:0; top:-9px; font-size:11px; font-weight:600; color:var(--iris); background:var(--sheet); padding-inline-start:8px; }
.A .pause { display:grid; grid-template-columns:68px 22px minmax(0,1fr); column-gap:12px; align-items:center; height:34px; color:var(--ink-3); font-size:13px; }
.A .pause .node b { width:8px; height:8px; border-radius:2px; box-shadow:none; background:var(--line); }
.A .pause .band { height:22px; border-radius:6px; display:flex; align-items:center; padding:0 10px; gap:8px; background:repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); }
.A .pause.past { opacity:.6; }
.A .divider { display:grid; grid-template-columns:68px 22px minmax(0,1fr); column-gap:12px; align-items:center; height:44px; color:var(--ink-2); font-size:13px; font-weight:600; }
.A .divider .node b { width:8px; height:2px; border-radius:0; box-shadow:none; background:var(--ink-3); }
.A .detail { position:sticky; top:68px; border-radius:14px; padding:24px; background:var(--sheet); box-shadow:0 0 0 1px var(--line), 0 12px 32px -20px rgb(0 0 0 / .18); }
.A .chip { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:12px; font-size:12px; font-weight:600; background:var(--hover); color:var(--ink-2); }
.A .chip.late { background:var(--late-tint); color:var(--late); } .A .chip.now { background:var(--due-tint); color:var(--due); } .A .chip.soon { background:var(--wash); color:var(--iris); }
.A .detail h2 { font-size:24px; line-height:1.2; letter-spacing:-.02em; margin-top:12px; font-weight:600; }
.A .detail .why { color:var(--ink-2); margin-top:6px; font-size:15px; }
.A dl { display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px 16px; margin:20px 0; padding:16px 0; border-block:1px solid var(--line); }
.A dt { color:var(--ink-2); font-size:13px; } .A dd { margin:0; font-weight:500; display:flex; align-items:center; gap:6px; justify-content:space-between; }
.A .copy { border:0; background:none; color:var(--ink-3); cursor:pointer; padding:4px; border-radius:6px; position:relative; }
.A .copy:hover { color:var(--ink); background:var(--hover); }
.A .detail .actions { display:grid; grid-template-columns:1fr auto auto; gap:8px; } .A .detail .actions .btn { justify-content:center; padding:0 12px; }
.A .hist { margin-top:24px; }
.A .hist h3 { font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:10px; }
.A .hist li { display:grid; grid-template-columns:64px 1fr; gap:12px; font-size:13px; padding:5px 0; }
.A .hist li span:first-child { color:var(--ink-3); }
.A ul { list-style:none; margin:0; padding:0; }
@media (max-width:1100px){ .A .cols { grid-template-columns:minmax(0,1fr); } .A .detail { position:static; } }
@media (max-width:760px){ .A .shell { grid-template-columns:1fr; } .A .side { display:none; } .A .main { margin:0; border-radius:0; padding:24px 16px 48px; } .A .row { grid-template-columns:56px 18px minmax(0,1fr) auto; } .A .now-row, .A .pause, .A .divider { grid-template-columns:56px 18px minmax(0,1fr); } .A .t { font-size:12px; } }

/* ═════════ B · NEXT CALL ═════════ */
.B { --bg:#EDF1EF; --sheet:#FFFFFF; --ink:#132320; --ink-2:#53625D; --ink-3:#75847F; --line:#D9E1DD; --hover:#F2F5F3; --pop:#FFFFFF;
  --thread:#1F6B5C; --thread-ink:#FFFFFF; --wash:#E0EEE9; --late:#B23B2A; --late-tint:#FAE7E2; --due:#8C5B00; --due-tint:#F6EDD6; --done:#1F6B5C; --ring:#1F6B5C;
  --toast:#132320; --toast-ink:#EDF1EF;
  font-family:"Hanken Grotesk",system-ui,sans-serif; font-size:15px; line-height:1.5; color:var(--ink); background:var(--bg); min-height:calc(100dvh - 44px); }
[data-theme="dark"] .B { --bg:#0D1412; --sheet:#141E1B; --ink:#E5EDEA; --ink-2:#9AAAA4; --ink-3:#7C8C86; --line:#24322E; --hover:#1A2622; --pop:#1A2622;
  --thread:#7FD1BC; --thread-ink:#0D1F1A; --wash:#163029; --late:#F09A88; --late-tint:#38201B; --due:#E6BF6E; --due-tint:#302818; --done:#7FD1BC; --ring:#7FD1BC; --toast:#E5EDEA; --toast-ink:#132320; }
.B .top { display:flex; align-items:center; gap:24px; height:60px; padding:0 28px; position:sticky; top:44px; z-index:5; background:var(--bg); }
.B .logo { font-weight:700; font-size:20px; letter-spacing:-.03em; }
.B .tabs { display:flex; gap:4px; }
.B .tab { border:0; background:none; height:36px; padding:0 12px; border-radius:18px; color:var(--ink-2); font-weight:500; cursor:pointer; display:flex; align-items:center; gap:8px; }
.B .tab:hover { color:var(--ink); background:rgb(0 0 0 / .04); }
[data-theme="dark"] .B .tab:hover { background:rgb(255 255 255 / .05); }
.B .tab[aria-current] { background:var(--ink); color:var(--bg); }
.B .tab .count { font-size:12px; font-weight:700; background:var(--late); color:#fff; border-radius:9px; min-width:18px; height:18px; display:grid; place-items:center; padding:0 5px; }
.B .top-end { margin-inline-start:auto; display:flex; align-items:center; gap:12px; }
.B .shift-pill { display:flex; align-items:center; gap:8px; height:32px; padding:0 12px; border-radius:16px; background:var(--sheet); box-shadow:0 0 0 1px var(--line); font-size:13px; font-weight:500; }
.B .shift-pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--thread); }
.B .avatar { width:32px; height:32px; border-radius:50%; background:var(--thread); color:var(--thread-ink); display:grid; place-items:center; font-weight:700; font-size:12px; }
.B .wrap { max-width:1180px; margin:0 auto; padding:20px 28px 64px; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:28px; align-items:start; }
.B .hello { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.B .hello h1 { font-size:22px; font-weight:600; letter-spacing:-.015em; }
.B .hello p { color:var(--ink-2); }
.B .hero { background:var(--sheet); border-radius:20px; padding:28px 32px 28px; box-shadow:0 0 0 1px rgb(0 0 0 / .04), 0 24px 48px -28px rgb(19 35 32 / .28); position:relative; overflow:hidden; }
.B .hero::before { content:""; position:absolute; inset-inline-start:0; top:28px; bottom:28px; width:4px; border-radius:0 4px 4px 0; background:var(--late); }
.B .hero.now::before { background:var(--due); } .B .hero.soon::before, .B .hero.later::before { background:var(--thread); }
.B .hero-in.enter { transition:opacity 260ms var(--ease-out), translate 260ms var(--ease-out), filter 260ms var(--ease-out); @starting-style { opacity:0; translate:0 12px; filter:blur(4px); } }
.B .hero-top { display:flex; align-items:center; gap:10px; color:var(--ink-2); font-size:14px; }
.B .status { font-weight:700; color:var(--late); }
.B .hero.now .status { color:var(--due); } .B .hero.soon .status, .B .hero.later .status { color:var(--thread); }

.B .fact b { font-weight:600; font-size:16px; }

.B .copy { border:0; background:var(--hover); color:var(--ink-2); width:32px; height:32px; border-radius:8px; display:grid; place-items:center; cursor:pointer; }
.B .note { margin-top:24px; padding:14px 16px; border-radius:12px; background:var(--hover); color:var(--ink-2); font-size:14px; }
.B .note b { color:var(--ink); font-weight:600; }
.B .hero-acts { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; align-items:center; }
.B .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 18px 0 16px; border-radius:12px; border:0; font-weight:600; cursor:pointer; font-size:15px; }
.B .btn-primary { background:var(--thread); color:var(--thread-ink); box-shadow:inset 0 1px 0 rgb(255 255 255 / .16), 0 1px 2px rgb(0 0 0 / .2); }

/* ═════════ A ═════════ */
function renderA() {
  const c = counts(), it = current(), lateN = c.late, nextHour = state.items.filter(i => i.due >= NOW && i.due - NOW <= 60).length;
  const today = sorted().filter(i => i.due < 1440), tomorrow = sorted().filter(i => i.due >= 1440);
  const entries = [
    ...today.map(i => ({ m: i.due, html: rowA(i) })),
    ...SHIFT.pauses.map(p => ({ m: p.a, html: `<div class="pause ${p.b <= NOW ? "past" : ""}"><div class="t num">${clock(p.a)}</div><div class="node"><b></b></div><div class="band">${I("coffee")}<span>${p.kind}</span><span class="num">${span(p.a, p.b)}</span></div></div>` })),
    { m: NOW + .5, html: `<div class="now-row" aria-label="Now ${clock(NOW)}"><div class="t num">${clock(NOW)}</div><div class="node"><b></b></div><div class="rule"><span>Now</span></div></div>` },
    { m: SHIFT.start - .5, html: `<div class="divider"><div class="t num">${clock(SHIFT.start)}</div><div class="node"><b></b></div><span>Shift started</span></div>` },
    { m: SHIFT.end + .1, html: `<div class="divider"><div class="t num">${clock(SHIFT.end)}</div><div class="node"><b></b></div><span>Shift ends</span></div>` },
  ].sort((a, b) => a.m - b.m).map(e => e.html);
  if (tomorrow.length) entries.push(`<div class="divider"><div class="t"></div><div class="node"><b></b></div><span>Tomorrow</span></div>`, ...tomorrow.map(rowA));
  const headline = lateN ? `<em>${lateN === 1 ? "One callback is" : `${["", "", "Two", "Three", "Four"][lateN] || lateN} callbacks are`} late.</em>` : state.items.length ? "You're on time." : "Queue clear.";
  return `<div class="A"><div class="shell">
    <aside class="side"><div class="logo">Mend <i></i></div>
      ${NAV.map(([ic, l], k) => `<button class="nav press" ${k === 0 ? 'aria-current="page"' : ""}>${I(ic)}<span>${l}</span>${k === 1 && c.late + c.now ? `<span class="count num">${c.late + c.now}</span>` : ""}</button>`).join("")}
      <div style="height:16px"></div><button class="nav press">${I("msg")}<span>Ask Mend</span></button>
      <div class="agent"><span class="avatar">NS</span><span><b style="font-weight:600">Nour Saleh</b><small class="num">Until 12:00 AM</small></span></div>
    </aside>
    <main class="main">
      <header class="page"><div><p class="date">Monday, October 12</p><h1>${headline}</h1><p class="sub">${nextHour ? `${nextHour} more due in the next hour. ` : ""}Lunch at 8:30 PM.</p></div>
        <button class="btn btn-primary press">${I("plus")}New follow-up</button></header>
      <div class="cols">
        <section aria-labelledby="tl"><div class="tl-head"><h2 id="tl">Your shift</h2><span class="num">${state.items.length} open</span></div><div class="tl">${entries.join("")}</div></section>
        ${it ? detailA(it) : `<aside class="detail"><h2>Nothing open.</h2><p class="why">New follow-ups land on the line at the time they're due.</p></aside>`}
      </div>
    </main></div></div>`;
}
function rowA(i) {
  const b = bucket(i);
  return `<div class="collapse ${state.busy === i.id + ":gone" ? "gone" : ""}"><div><div class="row is-${b}" role="button" tabindex="0" data-act="sel" data-id="${i.id}" aria-current="${state.sel === i.id}">
    <div class="t num">${i.due >= 1440 ? clock(i.due) : clock(i.due)}</div><div class="node"><b></b></div>
    <div style="min-width:0"><div class="name"><strong class="${state.busy === i.id ? "stitch" : ""}">${esc(i.name)}</strong>${i.caseId ? `<span class="id num">${i.caseId}</span>` : ""}</div><p class="reason">${esc(i.reason)}</p></div>
    <div><span class="due num">${rel(i)}</span><span class="acts"><button class="icon-btn press" data-act="resolve" data-id="${i.id}" aria-label="Mark ${esc(i.name)} resolved">${I("check")}</button><button class="icon-btn press" data-act="snooze" data-id="${i.id}" aria-label="Snooze ${esc(i.name)}">${I("alarm")}</button></span></div>
  </div></div></div>`;
}
function detailA(i) {
  const b = bucket(i);
  return `<aside class="detail" aria-label="Selected follow-up"><span class="chip ${b} num">${rel(i)}</span>
    <h2 class="${state.busy === i.id ? "stitch" : ""}">${esc(i.name)}</h2><p class="why">${esc(i.reason)}</p>
    <dl><dt>Callback</dt><dd><span class="num">${i.phone}</span><button class="copy" data-act="copy" data-v="${i.phone}" aria-label="Copy callback number">${I("copy")}</button></dd>
    <dt>Account</dt><dd><span class="num">${i.account}</span><button class="copy" data-act="copy" data-v="${i.account}" aria-label="Copy account number">${I("copy")}</button></dd>
    <dt>Case</dt><dd>${i.caseId || "Not saved"}</dd><dt>Due</dt><dd class="num">${i.due >= 1440 ? "Tomorrow " : ""}${clock(i.due)}</dd><dt>Attempts</dt><dd class="num">${i.attempts}</dd></dl>
    <div class="actions"><button class="btn btn-primary press" data-act="resolve" data-id="${i.id}">${I("check")}Resolved</button><button class="btn btn-ghost press" data-act="snooze" data-id="${i.id}">${I("alarm")}Snooze</button><button class="btn btn-ghost press">${I("headset")}Escalate</button></div>
    <div class="hist"><h3>History</h3><ul>${i.hist.map(([t, x]) => `<li><span class="num">${t}</span><span>${esc(x)}</span></li>`).join("")}</ul></div></aside>`;
}

/* ═════════ B ═════════ */
let lastHero = null;

      <div class="top-end"><span class="shift-pill num">On shift, lunch 8:30 PM</span><button class="tab press" aria-label="Ask Mend">${I("msg")}</button><span class="avatar">NS</span></div></div>

          <h2 class="${state.busy === it.id ? "stitch" : ""}">${esc(it.name)}</h2>
          <p class="why">${esc(it.reason)}</p>
          <div class="facts"><div class="fact phone"><small>Callback number</small><b class="num">${it.phone}<button class="copy press" data-act="copy" data-v="${it.phone}" aria-label="Copy callback number">${I("copy")}</button></b></div>
            <div class="fact"><small>Account</small><b class="num">${it.account}</b></div><div class="fact"><small>Case</small><b>${it.caseId || "Not saved"}</b></div></div>

        ${rest.length ? `<div class="then"><h3>Then <span class="num">${rest.length}</span></h3>${rest.map(r => { const rb = bucket(r); return `<div class="collapse"><div><button class="trow press" data-act="sel" data-id="${r.id}"><span class="t num">${r.due >= 1440 ? "Tue" : clock(r.due)}</span><span style="min-width:0"><strong>${esc(r.name)}</strong><p>${esc(r.reason)}</p></span><span class="tag ${rb} num">${rel(r)}</span></button></div></div>`; }).join("")}</div>` : ""}
      </section>
      <aside class="rail">
        <div class="card"><h3>Shift <a href="#">Schedule</a></h3><p class="big num">4 h 18 min left</p><p class="muted num">Ends 12:00 AM. Lunch 8:30–9:00 PM.</p>
          <div class="bar" aria-hidden="true"><span class="done" style="width:${shiftDone * 100}%"></span>${SHIFT.pauses.map(p => `<span class="p" style="left:${pct(p.a)};width:${((p.b - p.a) / (SHIFT.end - SHIFT.start)) * 100}%"></span>`).join("")}</div>

      </aside>
    </div></div>`;
}

/* ═════════ D ═════════ */
function renderD() {
  const c = counts(), it = current();
  const lateN = c.late, words = ["No", "One", "Two", "Three", "Four", "Five"];
  const show = i => state.filter === "all" || bucket(i) === state.filter;
  const today = sorted().filter(i => i.due < 1440 && show(i)), tomorrow = sorted().filter(i => i.due >= 1440 && show(i));
  const entries = today.map(i => ({ m: i.due, html: rowD(i) }));
  if (state.filter === "all" && today.length) entries.push({ m: NOW + .5, html: `<div class="now-row" aria-label="Now ${clock(NOW)}"><div class="t num">${clock(NOW)}</div><div class="node"><b></b></div><div class="rule"><span>Now</span></div></div>` });
  const lines = entries.sort((a, b) => a.m - b.m).map(e => e.html);
  if (tomorrow.length) lines.push(`<div class="divider"><div class="t"></div><div class="node"><b></b></div><span>Tomorrow</span></div>`, ...tomorrow.map(rowD));
  const headline = lateN ? `<em>${words[lateN] || lateN} callback${lateN === 1 ? " is" : "s are"} late.</em>` : state.items.length ? "You're on time." : "Queue clear.";
  const subParts = [c.now && `${c.now} due now`, c.soon && `${c.soon} more within 2 hours`].filter(Boolean);
  const F = [["all", "All"], ["late", "Late"], ["now", "Due now"], ["soon", "Soon"], ["later", "Later"]];
  return `<div class="A D"><div class="shell">
    <aside class="side"><div class="logo">Mend <i></i></div>
      ${NAV.map(([ic, l], k) => `<button class="nav press" ${k === 0 ? 'aria-current="page"' : ""}>${I(ic)}<span>${l}</span>${k === 1 && c.late + c.now ? `<span class="count num">${c.late + c.now}</span>` : ""}</button>`).join("")}
      <div style="height:16px"></div><button class="nav press">${I("msg")}<span>Ask Mend</span></button>
      <div class="agent"><span class="avatar">NS</span><span><b style="font-weight:600">Nour Saleh</b><small class="num">Until 12:00 AM</small></span></div>
    </aside>
    <main class="main">
      <header class="page"><div><p class="date">Monday, October 12</p><h1>${headline}</h1>${subParts.length ? `<p class="sub num">${subParts.join(", ").replace(/^./, ch => ch.toUpperCase())}.</p>` : ""}</div>
        <button class="btn btn-primary press">${I("plus")}New follow-up</button></header>
      <div class="cols">
        <section aria-label="Follow-ups">
          <div class="filters" role="group" aria-label="Filter follow-ups">${F.map(([k, l]) => `<button class="f ${k} press" data-act="filter" data-f="${k}" aria-pressed="${state.filter === k}">${l}<b class="num">${c[k]}</b></button>`).join("")}</div>
          <div class="tl">${lines.join("") || `<div class="clear"><h3>Nothing here.</h3><p>No follow-ups in this filter.</p></div>`}</div>
          <p class="keys"><span><kbd>J</kbd><kbd>K</kbd>Move</span><span><kbd>E</kbd>Resolve</span><span><kbd>S</kbd>Snooze</span></p>
        </section>
        ${it ? detailD(it) : `<aside class="detail"><div class="clear"><h3>Queue clear.</h3><p>New follow-ups show up here at the time they're due.</p></div></aside>`}
      </div>
    </main></div></div>`;
}
function rowD(i) {

      ${it ? `<div class="bar"><span class="crumb">Follow-ups <span>/</span> <b>${esc(it.name)}</b></span><div class="end"><button class="btn press" data-act="snooze" data-id="${it.id}">${I("alarm")}Snooze<kbd>S</kbd></button><button class="btn press">${I("headset")}Escalate<kbd>R</kbd></button><button class="btn btn-primary press" data-act="resolve" data-id="${it.id}">${I("check")}Resolve<kbd>E</kbd></button></div></div>
      <div class="body"><div class="body-in"><span class="st ${bucket(it)} num">${rel(it)}</span><br><h2 class="${state.busy === it.id ? "stitch" : ""}">${esc(it.name)}</h2><p class="why">${esc(it.reason)}</p>
        <div class="props"><div class="prop"><small>Callback</small><b class="mono">${it.phone}</b></div><div class="prop"><small>Account</small><b class="mono">${it.account}</b></div><div class="prop"><small>Case</small><b class="${it.caseId ? "mono" : ""}">${it.caseId || "Not saved"}</b></div><div class="prop"><small>Due</small><b class="num">${it.due >= 1440 ? "Tomorrow " : ""}${clock(it.due)}</b></div></div>
        <div class="sec"><h3>Activity</h3>${it.hist.map(([t, x]) => `<div class="ev"><i></i><span>${esc(x)}</span><time>${t}</time></div>`).join("")}<div class="composer"><span>Add a note</span><kbd>N</kbd></div></div></div></div>` : `<div class="body"><h2>Queue clear.</h2></div>`}
      <div class="foot"><span><kbd>J</kbd><kbd>K</kbd> Move</span><span><kbd>E</kbd> Resolve</span><span><kbd>S</kbd> Snooze</span><span class="shift">On shift until 12:00 AM. Lunch 8:30 PM.</span></div>
    </section></div></div>`;
}

/* ── render + interactions ── */
const app = document.getElementById("app");
function render() {
  document.documentElement.dataset.theme = state.theme;
  document.querySelectorAll("[data-dir]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dir === state.dir));
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeBtn === state.theme));
  document.getElementById("note").textContent = NOTES[state.dir];
  app.innerHTML = { A: renderA, B: renderB, C: renderC, D: renderD }[state.dir]();
  document.body.style.background = getComputedStyle(app.firstElementChild).getPropertyValue("--bg");
  app.firstElementChild.append(menuEl, toastEl);
}
const menuEl = document.getElementById("menu"), toastEl = document.getElementById("toast");

let toastTimer, undoFn;
function toast(msg, undo) {
  const t = document.getElementById("toast");
  document.getElementById("toast-msg").textContent = msg;
  document.getElementById("toast-undo").hidden = !undo; undoFn = undo;
  delete t.dataset.hidden; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.dataset.hidden = "", 5000);
}
document.getElementById("toast-undo").onclick = () => { undoFn?.(); document.getElementById("toast").dataset.hidden = ""; };

function resolve(id) {
  if (state.busy) return;
  const item = state.items.find(i => i.id === id); if (!item) return;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  state.busy = id; render();
  setTimeout(() => {
    state.busy = id + ":gone"; render();
    setTimeout(() => {
      const list = sorted(), idx = list.indexOf(item);
      state.items = state.items.filter(i => i.id !== id);
      const next = sorted()[Math.min(idx, state.items.length - 1)];
      state.sel = next?.id; state.busy = null; render();
      toast(`${item.name} marked resolved.`, () => { state.items.push(item); state.sel = item.id; render(); });
    }, reduced ? 0 : 220);
  }, reduced ? 600 : 950);
}
function snooze(id, m) {
  const item = state.items.find(i => i.id === id); if (!item) return;
  const before = item.due; item.due = NOW + m;
  if (state.dir === "B" && state.sel === id) state.sel = sorted().find(i => i.id !== id)?.id ?? id;
  render(); toast(`Snoozed until ${clock(item.due)}.`, () => { item.due = before; state.sel = id; render(); });
}
const menu = document.getElementById("menu");
function openMenu(btn, id) {
  const r = btn.getBoundingClientRect();
  menu.innerHTML = `<p>Call back in</p>${[30, 60, 120].map(m => `<button role="menuitem" data-act="snz" data-id="${id}" data-m="${m}">${m < 60 ? "30 minutes" : m === 60 ? "1 hour" : "2 hours"}<span class="num">${clock(NOW + m)}</span></button>`).join("")}`;
  menu.style.top = `${r.bottom + 6}px`; menu.style.left = `${Math.max(8, Math.min(r.right - 200, innerWidth - 208))}px`; menu.style.minWidth = "200px";
  delete menu.dataset.hidden; menu.querySelector("button")?.focus({ preventScroll: true });
}
const closeMenu = () => { menu.dataset.hidden = ""; };

document.addEventListener("click", e => {
  const dirB = e.target.closest("[data-dir]"); if (dirB) { state.dir = dirB.dataset.dir; write("mend-proto-dir", state.dir); if (!state.items.find(i => i.id === state.sel)) state.sel = sorted()[0]?.id; closeMenu(); return render(); }
  const thB = e.target.closest("[data-theme-btn]"); if (thB) { state.theme = thB.dataset.themeBtn; write("mend-proto-theme", state.theme); document.documentElement.classList.add("no-tr"); render(); return; }
  const el = e.target.closest("[data-act]");
  if (!menu.contains(e.target) && !(el && el.dataset.act === "snooze")) closeMenu();
  if (!el) return;
  const { act, id } = el.dataset;
  if (act === "sel") { if (state.busy) return; state.sel = id; render(); if (state.dir === "B") document.querySelector(".B .hero")?.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  else if (act === "resolve") { e.stopPropagation(); resolve(id); }
  else if (act === "snooze") { e.stopPropagation(); menu.dataset.hidden === undefined ? closeMenu() : openMenu(el, id); }
  else if (act === "snz") { e.stopPropagation(); closeMenu(); snooze(id, +el.dataset.m); }
  else if (act === "filter") { state.filter = el.dataset.f; render(); }
  else if (act === "copy") { e.stopPropagation(); navigator.clipboard?.writeText(el.dataset.v).catch(() => {}); toast(`Copied ${el.dataset.v}.`); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeMenu();
  if (e.key === "Enter" && e.target.matches?.('[role="button"][data-act="sel"]')) { e.target.click(); return; }
  if (!"CD".includes(state.dir) || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input,textarea")) return;
  const list = sorted().filter(i => state.filter === "all" || bucket(i) === state.filter);
  const ix = list.findIndex(i => i.id === state.sel);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); state.sel = list[Math.min(ix + 1, list.length - 1)]?.id; render(); document.querySelector('.C .r[aria-current="true"], .D .row[aria-current="true"]')?.scrollIntoView({ block: "nearest" }); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); state.sel = list[Math.max(ix - 1, 0)]?.id; render(); document.querySelector('.C .r[aria-current="true"], .D .row[aria-current="true"]')?.scrollIntoView({ block: "nearest" }); }
  else if (e.key === "e" && state.sel) resolve(state.sel);
  else if (e.key === "s" && state.sel) { const b = document.querySelector('.C .bar [data-act="snooze"], .D .detail [data-act="snooze"]'); b && openMenu(b, state.sel); }
});
render();
</script>
</body>
</html>
