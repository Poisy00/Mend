<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mend Follow-ups, Focus line prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Prototype chrome ───────── */
:root { --ease-out:cubic-bezier(.23,1,.32,1); --ease-swap:cubic-bezier(.2,0,0,1); }
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; }
html[data-theme="dark"] { color-scheme:dark; }
body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; background:#F1F2F4; }
html[data-theme="dark"] body { background:#0E1014; }
button,input,select,textarea { font:inherit; color:inherit; }
button { -webkit-tap-highlight-color:transparent; }
h1,h2,h3 { text-wrap:balance; margin:0; } p { text-wrap:pretty; margin:0; }
.proto-bar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 16px; background:#111; color:#eee; font:500 13px/1.4 system-ui,sans-serif; min-height:44px; }
.proto-bar strong { font-weight:600; margin-inline-end:8px; }
.proto-bar .seg { display:flex; gap:2px; background:#2a2a2a; padding:2px; border-radius:8px; }
.proto-bar .seg button { border:0; background:transparent; color:#bbb; padding:5px 10px; border-radius:6px; cursor:pointer; transition:background-color 150ms, color 150ms; }
.proto-bar .seg button[aria-pressed="true"] { background:#fff; color:#111; }
.proto-bar .lbl { color:#999; }
.proto-bar .note { color:#999; margin-inline-start:auto; max-width:46ch; }
.proto-bar :focus-visible { outline:2px solid #fff; outline-offset:2px; }
@media (max-width:760px){ .proto-bar .note { display:none; } }

.stitch { position:relative; }
.stitch::after { content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:repeating-linear-gradient(90deg,var(--done) 0 6px,transparent 6px 10px); clip-path:inset(0 100% 0 0); animation:stitch 900ms var(--ease-out) forwards; }
@keyframes stitch { 0%{clip-path:inset(0 100% 0 0)} 55%{clip-path:inset(0)} 100%{clip-path:inset(0);opacity:0} }
.collapse { display:grid; grid-template-rows:1fr; transition:grid-template-rows 220ms var(--ease-out), opacity 220ms var(--ease-out); }
.collapse > * { min-height:0; overflow:hidden; }
.collapse.gone { grid-template-rows:0fr; opacity:0; }
.ico { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
.press { transition:scale 150ms var(--ease-out), background-color 150ms, color 150ms, box-shadow 150ms; }
.press:not(:disabled):active { scale:.96; }
.num { font-variant-numeric:tabular-nums; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.A :focus-visible { outline:2px solid var(--ring); outline-offset:2px; }

.menu { position:fixed; z-index:60; min-width:168px; padding:4px; border-radius:12px; background:var(--pop); color:var(--ink); box-shadow:0 0 0 1px var(--line), 0 16px 40px -16px rgb(0 0 0 / .35); transition:opacity 160ms var(--ease-out), scale 160ms var(--ease-out); overscroll-behavior:contain; max-height:70dvh; overflow:auto; }
.menu[data-hidden] { opacity:0; scale:.97; pointer-events:none; visibility:hidden; }
.menu p { padding:6px 10px 4px; font-size:12px; color:var(--ink-2); }
.menu button { display:flex; width:100%; justify-content:space-between; align-items:center; gap:16px; border:0; background:none; text-align:start; padding:0 10px; min-height:40px; border-radius:8px; font-size:14px; cursor:pointer; }
.menu button:hover { background:var(--hover); }
.menu button span { color:var(--ink-2); }
.toast { position:fixed; z-index:70; left:50%; bottom:20px; translate:-50% 0; display:flex; align-items:center; gap:14px; padding:10px 10px 10px 16px; border-radius:12px; background:var(--toast); color:var(--toast-ink); font-size:14px; box-shadow:0 12px 32px -12px rgb(0 0 0 / .45); transition:opacity 200ms var(--ease-out), translate 200ms var(--ease-out); max-width:calc(100vw - 24px); }
.toast[data-hidden] { opacity:0; translate:-50% 12px; pointer-events:none; visibility:hidden; }
.toast button { border:0; background:rgb(255 255 255 / .14); color:inherit; min-height:40px; padding:0 12px; border-radius:8px; cursor:pointer; font-weight:600; }
.toast button[hidden] { display:none; }
html[data-theme="dark"] .toast button { background:rgb(0 0 0 / .12); }
@media (prefers-reduced-motion:reduce){ .menu,.toast{ scale:1 !important; } .toast[data-hidden]{ translate:-50% 0 !important; } .press:active{ scale:1 !important; } .stitch::after{ animation-duration:600ms; } .collapse{ transition-property:opacity; } .panel-in { animation:none !important; } }

/* ───────── Tokens and shell (Today D) ───────── */
.A { --bg:#F1F2F4; --sheet:#FFFFFF; --ink:#16181D; --ink-2:#5A606C; --ink-3:#7A808C; --line:#E2E4E9; --hover:#F4F5F7; --pop:#FFFFFF;
  --iris:#4E3D8F; --iris-ink:#FFFFFF; --wash:#EEEBF8; --late:#B4381F; --late-tint:#FBEAE4; --due:#8A5A00; --due-tint:#F7EED8; --done:#17714F; --done-tint:#E1F2EA; --ring:#4E3D8F;
  --toast:#16181D; --toast-ink:#F1F2F4;
  font-family:"Schibsted Grotesk",system-ui,sans-serif; font-size:14px; line-height:1.45; color:var(--ink); background:var(--bg); min-height:calc(100dvh - 44px); }
html[data-theme="dark"] .A { --bg:#0E1014; --sheet:#161920; --ink:#E8EAEE; --ink-2:#9BA1AD; --ink-3:#7D8390; --line:#262A33; --hover:#1E222A; --pop:#1E222A;
  --iris:#B4A6F3; --iris-ink:#191433; --wash:#241F3C; --late:#F29A85; --late-tint:#3A211B; --due:#E8C06E; --due-tint:#33291A; --done:#7FD3AE; --done-tint:#17322A; --ring:#B4A6F3; --toast:#E8EAEE; --toast-ink:#16181D; }
.A .shell { display:grid; grid-template-columns:224px minmax(0,1fr); min-height:inherit; }
.A .side { padding:14px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:44px; height:calc(100dvh - 44px); }
.A .logo { font-weight:700; font-size:19px; letter-spacing:-.03em; padding:6px 10px 22px; display:flex; align-items:center; gap:8px; }
.A .logo i { width:18px; height:2px; background:repeating-linear-gradient(90deg,var(--iris) 0 4px,transparent 4px 7px); display:inline-block; }
.A .nav { display:flex; align-items:center; gap:10px; height:40px; padding:0 10px; border-radius:8px; color:var(--ink-2); font-weight:500; text-decoration:none; border:0; background:none; width:100%; cursor:pointer; text-align:start; }
.A .nav:hover { background:rgb(0 0 0 / .04); color:var(--ink); }
html[data-theme="dark"] .A .nav:hover { background:rgb(255 255 255 / .05); }
.A .nav[aria-current] { background:var(--sheet); color:var(--ink); box-shadow:0 0 0 1px rgb(0 0 0 / .06), 0 1px 2px rgb(0 0 0 / .05); }
.A .nav[aria-current] .ico { color:var(--iris); }
.A .nav .count { margin-inline-start:auto; font-size:12px; font-weight:600; min-width:20px; height:20px; padding:0 6px; border-radius:10px; display:grid; place-items:center; background:var(--late-tint); color:var(--late); }
.A .agent { margin-top:auto; display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:10px; }
.A .avatar { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; background:var(--sheet); box-shadow:0 0 0 1px var(--line); color:var(--ink-2); }
.A .agent small { display:flex; align-items:center; gap:6px; color:var(--ink-2); font-size:12px; }
.A .agent small::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--done); }
.A .main { margin:8px 8px 8px 0; background:var(--sheet); border-radius:14px; box-shadow:0 0 0 1px rgb(0 0 0 / .05), 0 8px 24px -14px rgb(0 0 0 / .1); padding:36px 40px 64px; min-width:0; }
.A header.page { display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; padding-bottom:24px; }
.A .date { color:var(--ink-2); font-size:14px; font-weight:500; margin-bottom:6px; }
.A h1 { font-size:32px; line-height:1.12; font-weight:600; letter-spacing:-.025em; }
.A h1 em, .A .sub em { font-style:normal; color:var(--late); }
.A .sub { color:var(--ink-2); margin-top:8px; font-size:15px; }
.A .btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px 0 14px; border-radius:9px; border:0; cursor:pointer; font-weight:600; font-size:14px; }
.A .btn:disabled { opacity:.45; cursor:not-allowed; }
.A .btn-primary { background:var(--iris); color:var(--iris-ink); box-shadow:inset 0 1px 0 rgb(255 255 255 / .14), 0 1px 2px rgb(0 0 0 / .2); }
.A .btn-ghost { background:var(--sheet); color:var(--ink); box-shadow:0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / .04); }
.A .btn-ghost:not(:disabled):hover { background:var(--hover); }
.A .btn-quiet { background:none; color:var(--ink-2); padding:0 12px; }
.A .btn-quiet:hover { background:var(--hover); color:var(--ink); }
.A .btn-danger { background:none; color:var(--late); padding:0 12px; }
.A .btn-danger:hover { background:var(--late-tint); }
.A .tl-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.A .row { display:grid; grid-template-columns:68px 22px minmax(0,1fr) auto; align-items:center; column-gap:12px; min-height:60px; padding:0 12px 0 0; border-radius:10px; cursor:pointer; position:relative; outline-offset:-2px; }
.A .row:hover { background:var(--hover); }
.A .row[aria-current="true"] { background:var(--wash); }
.A .t { text-align:end; font-size:13px; color:var(--ink-2); font-weight:500; }
.A .node { align-self:stretch; position:relative; display:grid; place-items:center; }
.A .node::before { content:""; position:absolute; top:0; bottom:0; left:50%; width:2px; translate:-1px 0; background:var(--line); }
.A .tl > :first-child .node::before { top:50%; }
.A .tl > :last-child .node::before { bottom:50%; }
.A .node b { position:relative; width:10px; height:10px; border-radius:50%; background:var(--sheet); box-shadow:0 0 0 2px var(--ink-3); }
.A .is-late .node b { background:var(--late); box-shadow:0 0 0 3px var(--late-tint); }
.A .is-now .node b { background:var(--due); box-shadow:0 0 0 3px var(--due-tint); }
.A .is-soon .node b { box-shadow:0 0 0 2px var(--iris); }
.A .is-done .node b { background:var(--done); box-shadow:0 0 0 3px var(--done-tint); }
.A .is-done .name strong { color:var(--ink-2); font-weight:500; }
.A .name { display:flex; align-items:baseline; gap:8px; min-width:0; }
.A .name strong { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.A .id { font-size:12px; color:var(--ink-3); flex:none; }
.A .reason { color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13.5px; }
.A .due { font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap; }
.A .is-late .due { color:var(--late); font-weight:600; }
.A .is-now .due { color:var(--due); font-weight:600; }
.A .is-vm .due { color:var(--due); font-weight:600; }
.A .acts { display:none; gap:4px; }
@media (hover:hover){ .A .row:hover .acts, .A .row:focus-within .acts { display:flex; } .A .row:hover .due, .A .row:focus-within .due { display:none; } }
.A .icon-btn { width:32px; height:32px; border-radius:8px; border:0; display:grid; place-items:center; cursor:pointer; background:var(--sheet); box-shadow:0 0 0 1px var(--line); color:var(--ink-2); position:relative; }
.A .icon-btn::before { content:""; position:absolute; inset:-4px; }
.A .icon-btn:hover { color:var(--ink); }
.A .now-row { display:grid; grid-template-columns:68px 22px minmax(0,1fr); column-gap:12px; align-items:center; height:28px; }
.A .now-row .t { color:var(--iris); font-weight:700; }
.A .now-row .node b { width:12px; height:12px; background:var(--iris); box-shadow:0 0 0 4px var(--wash); }
.A .now-row .rule { height:2px; background:var(--iris); border-radius:2px; position:relative; }
.A .now-row .rule span { position:absolute; inset-inline-end:0; top:-9px; font-size:11px; font-weight:600; color:var(--iris); background:var(--sheet); padding-inline-start:8px; }
.A .divider { display:grid; grid-template-columns:68px 22px minmax(0,1fr); column-gap:12px; align-items:center; height:44px; color:var(--ink-2); font-size:13px; font-weight:600; }
.A .divider .node b { width:8px; height:2px; border-radius:0; box-shadow:none; background:var(--ink-3); }
.A .detail { position:sticky; top:68px; border-radius:14px; padding:24px; background:var(--sheet); box-shadow:0 0 0 1px var(--line), 0 12px 32px -20px rgb(0 0 0 / .18); max-height:calc(100dvh - 84px); overflow:auto; overscroll-behavior:contain; }
.A .chip { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:12px; font-size:12px; font-weight:600; background:var(--hover); color:var(--ink-2); }
.A .chip.late { background:var(--late-tint); color:var(--late); } .A .chip.now { background:var(--due-tint); color:var(--due); } .A .chip.soon { background:var(--wash); color:var(--iris); } .A .chip.done { background:var(--done-tint); color:var(--done); }
.A .detail h2 { font-size:24px; line-height:1.2; letter-spacing:-.02em; margin-top:12px; font-weight:600; }
.A .detail .why { color:var(--ink-2); margin-top:6px; font-size:15px; }
.A .copy { border:0; background:none; color:var(--ink-3); cursor:pointer; padding:4px; border-radius:6px; position:relative; }
.A .copy:hover { color:var(--ink); background:var(--hover); }
.A ul { list-style:none; margin:0; padding:0; }
.A .filters { display:flex; gap:4px; padding:4px; border-radius:12px; background:var(--bg); width:max-content; max-width:100%; overflow-x:auto; margin-bottom:20px; }
.A .f { display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; border:0; border-radius:9px; background:none; color:var(--ink-2); font-weight:500; cursor:pointer; white-space:nowrap; }
.A .f:hover { color:var(--ink); }
.A .f[aria-pressed="true"], .A .f[aria-selected="true"] { background:var(--sheet); color:var(--ink); box-shadow:0 0 0 1px rgb(0 0 0 / .05), 0 1px 3px rgb(0 0 0 / .08); }
.A .f b { font-size:12px; font-weight:600; min-width:20px; height:20px; padding:0 6px; border-radius:10px; display:grid; place-items:center; background:var(--hover); color:var(--ink-2); }
.A .f.late b { background:var(--late-tint); color:var(--late); } .A .f.now b { background:var(--due-tint); color:var(--due); } .A .f.soon b { background:var(--wash); color:var(--iris); } .A .f.done b { background:var(--done-tint); color:var(--done); }
.A .row { min-height:68px; }
.A .callout { margin:20px 0 0; padding:14px 16px; border-radius:12px; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; }
.A .callout small { display:block; color:var(--ink-2); font-size:12.5px; }
.A .callout b { font-size:24px; font-weight:600; letter-spacing:-.01em; }
.A .callout .copy { width:40px; height:40px; display:grid; place-items:center; background:var(--sheet); box-shadow:0 0 0 1px var(--line); border-radius:9px; color:var(--ink-2); }
.A kbd { font:600 11px/1 "Schibsted Grotesk",sans-serif; min-width:18px; height:18px; padding:0 4px; border-radius:5px; display:inline-grid; place-items:center; background:rgb(255 255 255 / .18); }
.A .btn-ghost kbd { background:var(--hover); color:var(--ink-2); }
@media (hover:none){ .A kbd { display:none; } }
.A .keys { display:flex; gap:14px; margin-top:16px; font-size:12px; color:var(--ink-3); flex-wrap:wrap; }
.A .keys kbd { background:var(--hover); color:var(--ink-2); margin-inline-end:4px; }
.A .clear { padding:56px 24px; text-align:center; } .A .clear h3 { font-size:20px; letter-spacing:-.015em; } .A .clear p { color:var(--ink-2); margin-top:4px; }
.A .tag-u { font-size:11.5px; font-weight:600; padding:1px 7px; border-radius:9px; background:var(--late-tint); color:var(--late); flex:none; }

/* Form controls */
.A .fld { display:block; min-width:0; }
.A .fld > span.l { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:13px; color:var(--ink-2); margin-bottom:6px; font-weight:500; }
.A .in { width:100%; height:44px; padding:0 12px; border:0; border-radius:10px; background:var(--sheet); box-shadow:0 0 0 1px var(--line); color:var(--ink); transition:box-shadow 150ms; min-width:0; }
.A .in:hover { box-shadow:0 0 0 1px var(--ink-3); }
.A .in:focus-visible { outline:2px solid var(--ring); outline-offset:1px; box-shadow:0 0 0 1px var(--ring); }
.A textarea.in { height:auto; padding:10px 12px; resize:vertical; line-height:1.5; }
.A .in::placeholder { color:var(--ink-3); }
.A .saved { color:var(--done); font-size:12px; font-weight:600; }
.A .saved[hidden] { display:none; }

@media (max-width:1100px){ .A .main { padding:28px 28px 56px; } }
@media (max-width:760px){ .A .shell { grid-template-columns:1fr; } .A .side { display:none; } .A .main { margin:0; border-radius:0; padding:24px 16px 48px; } .A h1 { font-size:28px; } .A .row { grid-template-columns:56px 18px minmax(0,1fr) auto; } .A .now-row, .A .divider { grid-template-columns:56px 18px minmax(0,1fr); } .A .t { font-size:12px; } }


/* ───────── Follow-ups page ───────── */
.A .cols { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:40px; align-items:start; }
.A .actions-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.A .switch { display:inline-flex; align-items:center; gap:10px; min-height:40px; padding:0 8px; border:0; background:none; color:var(--ink-2); cursor:pointer; border-radius:9px; font-weight:500; }
.A .switch:hover { color:var(--ink); background:var(--hover); }
.A .switch i { width:34px; height:20px; border-radius:10px; background:var(--line); position:relative; transition:background-color 150ms; }
.A .switch i::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--sheet); box-shadow:0 1px 2px rgb(0 0 0 / .3); transition:translate 150ms var(--ease-out); }
.A .switch[aria-checked="true"] i { background:var(--iris); }
.A .switch[aria-checked="true"] i::after { translate:14px 0; }
.A .toolbar { display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap; margin-bottom:20px; }
.A .toolbar .filters { margin:0; }
.A .search { position:relative; flex:0 1 300px; min-width:min(100%,220px); }
.A .search .ico { position:absolute; inset-inline-start:13px; top:50%; translate:0 -50%; color:var(--ink-3); pointer-events:none; }
.A .search input { padding-inline-start:38px; background:var(--bg); box-shadow:none; }
.A .search input:hover { box-shadow:0 0 0 1px var(--line); }
.A .rescount { margin-inline-start:auto; color:var(--ink-2); font-size:13px; }

.A .back { display:none; margin:-8px 0 8px -12px; }
.A .chiprow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.A .detail.panel-in { animation:panel-in 200ms var(--ease-out) both; }
@keyframes panel-in { from { opacity:0; translate:0 6px; } to { opacity:1; translate:0 0; } }
.A .sec { margin-top:24px; }
.A .sec h3, .A .pad-h { font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:10px; }
.A .pad-h { margin:22px 0 10px; }
.A .sec p.ctx { font-size:14px; color:var(--ink-2); white-space:pre-wrap; }
.A .btn-wide { width:100%; justify-content:center; height:48px; font-size:15px; }
.A .outgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:8px; }
.A .out { display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-height:60px; padding:10px 12px; border-radius:10px; border:0; background:var(--sheet); box-shadow:0 0 0 1px var(--line); cursor:pointer; text-align:start; width:100%; }
.A .out:hover { background:var(--hover); }
.A .out .top { display:flex; width:100%; justify-content:space-between; align-items:center; font-weight:600; font-size:14px; gap:8px; }
.A .out .fx { font-size:12.5px; color:var(--ink-2); line-height:1.35; }
.A .out kbd, .A .orow kbd { background:var(--hover); color:var(--ink-2); }
.A .out[aria-expanded="true"] { background:var(--wash); box-shadow:0 0 0 1px var(--iris); }
.A .pick { margin-top:8px; padding:12px; border-radius:10px; background:var(--bg); display:grid; gap:10px; }
.A .pick .r { display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; }
.A .pick .in { flex:1 1 180px; }
.A .vmrow { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.A .vmrow .btn { justify-content:center; height:48px; }
.A dl.facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; margin:22px 0 0; }
.A dl.facts > div { min-width:0; }
.A dl.facts .wide { grid-column:1 / -1; }

  vmyes: it => { it.status = "active"; it.due = NOW + 30; it.hist.unshift([clock(NOW), "Voicemail left."]); return `Voicemail noted. Back at ${clock(it.due)}.`; },

  else if (e.key === "e" && it && isActive(it)) startResolve(it.id);
  else if (e.key === "s" && it && isActive(it)) { const a = $('.row[aria-current="true"]'); a && openMenu(a, it.id); }
  else if (/^[1-6]$/.test(e.key) && it && isActive(it) && it.status === "active") { const k = OUT[+e.key - 1][0]; if (k === "pick") { S.pick = true; renderDetail(); $("#pickAt")?.focus(); } else outcome(it.id, k); }
});
matchMedia("(max-width:1100px)").addEventListener?.("change", () => renderAll());
renderAll();
</script>
